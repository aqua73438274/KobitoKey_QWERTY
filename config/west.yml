manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: caksoylar  # <-- led
      url-base: https://github.com/caksoylar
    - name: urob
      url-base: https://github.com/urob
    - name: mjmjm0101
      url-base: https://github.com/mjmjm0101

  projects:
    # ZMK 本体。公式の app/west.yml を取り込む
    # 検証用ブランチ: レイヤーロック (main で追加) を使うため v0.3 -> main
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # PMW3610 ドライバ（外部モジュール）
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main
      # 置き場所を明示したい場合は path を指定（任意）
      # path: modules/zmk-pmw3610-driver

    # Sensor-rotation
    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    # LED
    - name: zmk-rgbled-widget  # <-- led
      remote: caksoylar
      revision: main

    - name: zmk-helpers
      remote: urob
      revision: main
    # urob leader-key モジュール (ZMK main 未収録機能をモジュール提供)
    - name: zmk-leader-key
      remote: urob
      revision: main
    - name: zmk-input-processor-scroll-inertia
      remote: mjmjm0101
      revision: f7dadefee453d555fe066d13a3de3bb60739b45e

  self:
    path: config
